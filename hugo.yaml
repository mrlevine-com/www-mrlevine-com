baseURL: https://www.mrlevine.com/
locale: en-us
title: Mr. Levine
enableEmoji: true
buildFuture: true
menus:
  main:
    - name: Calendar
      pageRef: /calendar
    - name: Courses
      pageRef: /courses
    - name: Glossary
      pageRef: /glossary
    - name: Search
      pageRef: /search
taxonomies:
  unit: units
markup:
  goldmark:
    renderer:
      unsafe: true
    renderHooks:
      link:
        useEmbedded: always
  highlight:
    noClasses: false
outputs:
  home: [html, rss, json, backlinks]
module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod
    - path: github.com/jmooring/hugo-module-backlinks
params:
  profileMode:
    enabled: true
    title: Computer Science Teacher
    subtitle: ":round_pushpin: Archbishop McCarthy High School"
    imageUrl: icon.png
    imageTitle: Mr. Levine
    imageWidth: 200
    imageHeight: 200
    buttons:
      - name: AP Computer Science Principles
        url: /courses/computer-science-principles/#today
      - name: Artificial Intelligence in the World
        url: /courses/artificial-intelligence-foundations/#today
      - name: Computer Fundamentals
        url: /courses/computer-science-discoveries/#today
  showBreadCrumbs: true
  dateFormat: Monday, January 2, 2006
  editPost:
    url: https://raw.githubusercontent.com/mrlevine-com/www-mrlevine-com/refs/heads/main/content
    text: </> View Markdown
    appendFilePath: true
  showTOC: true
  tocOpen: true
  showPostNavLinks: true
  assets:
    favicon: icon.png
  fuseOpts:
    threshold: 0.2
