baseURL: https://www.mrlevine.com/
locale: en-us
title: Mr. Levine
enableEmoji: true
buildFuture: true
menus:
  main:
    - name: Calendar
      pageRef: /calendar
    - name: Courses
      pageRef: /courses
markup:
  goldmark:
    renderer:
      unsafe: true
module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod
params:
  profileMode:
    enabled: true
    title: Computer Science Teacher
    subtitle: ":round_pushpin: Archbishop McCarthy High School"
    imageUrl: icon.png
    imageTitle: Mr. Levine
    imageWidth: 200
    imageHeight: 200
    buttons:
      - name: View Calendar
        url: /calendar
  showBreadCrumbs: true
  editPost:
    url: https://github.com/mrlevine-com/www-mrlevine-com/edit/main/content
    text: "✎ Propose Changes on GitHub"
    appendFilePath: true
  showTOC: true
  showPostNavLinks: true
