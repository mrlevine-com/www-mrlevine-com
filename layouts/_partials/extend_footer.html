<script>
(function () {
	var AUTH_ORIGIN = (window.location.hostname === "localhost")
		? "http://localhost:8787"
		: "https://auth.mrlevine.com";

	function courseOf(href) {
		return new URL(href).pathname.split("/")[2];
	}

	function init() {
		var menu = document.getElementById("menu");
		if (!menu) return;

		var item = document.createElement("li");
		item.className = "auth-status";
		menu.appendChild(item);

		function renderSignedOut() {
			var url = AUTH_ORIGIN + "/?callbackURL=" + encodeURIComponent(window.location.href);
			var link = document.createElement("a");
			link.href = url;
			link.textContent = "Sign In";
			item.appendChild(link);
		}

		function renderSignedIn(user) {
			var title = document.querySelector(".profile_inner h1");
			var name = user && user.name;
			if (title && name) {
				var line = document.createElement("span");
				line.className = "profile-name";
				line.textContent = name + "'s";
				title.prepend(line);
			}

			var courses = ((user && user.courses) || "").split(",").filter(Boolean);
			var buttons = Array.from(document.querySelectorAll(".profile .buttons .button"));
			var myButtons = buttons.filter(function (button) {
				return courses.indexOf(courseOf(button.href)) !== -1;
			});
			if (myButtons.length) {
				buttons.forEach(function (button) {
					button.hidden = myButtons.indexOf(button) === -1;
				});
			}

			if (window.location.pathname === "/courses/") {
				document.querySelectorAll(".post-entry").forEach(function (entry) {
					var course = courseOf(entry.querySelector(".entry-link").href);
					var heading = entry.querySelector(".entry-header h2");
					var star = document.createElement("button");
					star.className = "course-star";
					star.setAttribute("aria-label", "Star " + heading.textContent.trim());
					function render() {
						var starred = courses.indexOf(course) !== -1;
						star.textContent = starred ? "⭐" : "☆";
						star.setAttribute("aria-pressed", starred);
						star.title = starred ? "Unstar this course" : "Star this course";
					}
					star.onclick = function () {
						var previous = courses.slice();
						courses = courses.indexOf(course) !== -1
							? courses.filter(function (c) { return c !== course; })
							: courses.concat(course);
						render();
						fetch(AUTH_ORIGIN + "/api/auth/update-user", {
							method: "POST",
							credentials: "include",
							headers: { "Content-Type": "application/json" },
							body: JSON.stringify({ courses: courses.join(",") })
						}).then(function (res) {
							if (!res.ok) throw new Error(res.status);
						}).catch(function () {
							courses = previous;
							render();
						});
					};
					render();
					heading.appendChild(star);
				});
			}

			var link = document.createElement("a");
			link.href = "#";
			link.textContent = "Sign Out";
			link.onclick = function (e) {
				e.preventDefault();
				fetch(AUTH_ORIGIN + "/api/auth/sign-out", {
					method: "POST",
					credentials: "include",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({})
				}).then(function () { window.location.reload(); });
			};
			item.appendChild(link);
		}

		fetch(AUTH_ORIGIN + "/api/auth/get-session", { credentials: "include" })
			.then(function (res) { return res.json(); })
			.then(function (data) {
				if (data && data.session) {
					renderSignedIn(data.user);
				} else {
					renderSignedOut();
				}
			})
			.catch(renderSignedOut);
	}

	if (document.readyState === "loading") {
		document.addEventListener("DOMContentLoaded", init);
	} else {
		init();
	}
})();
</script>
