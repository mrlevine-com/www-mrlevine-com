{{ if .Get "summary" }}
{{ else }}
{{ warnf "missing value for param 'summary': %s" .Position }}
{{ end }}
<p><details {{ if (eq (.Get "openByDefault") true) }} open=true {{ end }} style="border-left: 1px dotted var(--secondary); padding-left: 10px;">
	<summary markdown="span">{{ .Get "summary" | markdownify }}</summary>
	<div style="height: var(--content-gap);"></div>
	{{ .Inner | markdownify }}
</details></p>
