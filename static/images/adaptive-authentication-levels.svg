<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="sans-serif" font-size="15" text-anchor="middle">
  <text x="360" y="24" font-size="16" font-weight="bold" fill="#333">AI combines time, place, and device into a risk level</text>
  <g fill="none" stroke-width="3">
    <rect x="15" y="45" width="220" height="215" rx="10" stroke="#5b8c3a"/>
    <rect x="250" y="45" width="220" height="215" rx="10" stroke="#c77d0a"/>
    <rect x="485" y="45" width="220" height="215" rx="10" stroke="#d9534f"/>
  </g>
  <g font-size="20" font-weight="bold">
    <text x="125" y="80" fill="#5b8c3a">Low risk</text>
    <text x="360" y="80" fill="#c77d0a">Medium risk</text>
    <text x="595" y="80" fill="#d9534f">High risk</text>
  </g>
  <g fill="#333" font-size="14">
    <text x="125" y="108">Usual phone,</text>
    <text x="125" y="126">at home</text>
    <text x="360" y="108">Usual phone,</text>
    <text x="360" y="126">new Wi-Fi at 11 PM</text>
    <text x="595" y="108">New phone, new city,</text>
    <text x="595" y="126">3 AM, failed tries</text>
  </g>
  <g stroke="#777" stroke-width="3" fill="none">
    <path d="M125,140 V172 M117,164 L125,173 L133,164"/>
    <path d="M360,140 V172 M352,164 L360,173 L368,164"/>
    <path d="M595,140 V172 M587,164 L595,173 L603,164"/>
  </g>
  <g fill="#333" font-weight="bold">
    <text x="125" y="205">Password</text>
    <text x="360" y="205">Password</text>
    <text x="360" y="227">+ code</text>
    <text x="595" y="205">Password</text>
    <text x="595" y="227">+ Face ID</text>
    <text x="595" y="249">+ code</text>
  </g>
</svg>
