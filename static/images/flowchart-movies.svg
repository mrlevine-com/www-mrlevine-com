<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="sans-serif" font-size="16" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="640" height="370" fill="#fff"/>
  <rect x="270" y="20" width="100" height="40" rx="4" fill="#e8f4fd" stroke="#333"/>
  <text x="320" y="46" font-family="monospace">time</text>
  <line x1="320" y1="60" x2="320" y2="93" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="320,95 440,170 320,245 200,170" fill="#eee" stroke="#333"/>
  <text x="320" y="176" font-family="monospace" font-size="20">time &lt; 8</text>
  <polyline points="200,170 120,170 120,298" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="160" font-weight="bold">true</text>
  <polyline points="440,170 520,170 520,298" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="160" font-weight="bold">false</text>
  <rect x="20" y="300" width="200" height="50" rx="4" fill="#fff" stroke="#333"/>
  <text x="120" y="330">You can go!</text>
  <rect x="420" y="300" width="200" height="50" rx="4" fill="#fff" stroke="#333"/>
  <text x="520" y="330">You can't go.</text>
</svg>
