<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 790 800" font-family="sans-serif" font-size="16" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="100" y="20" width="260" height="40" rx="4" fill="#e8f4fd" stroke="#333"/>
  <text x="230" y="46" font-family="monospace">day, age, discountCode</text>
  <line x1="230" y1="60" x2="230" y2="93" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="230,95 460,170 230,245 0,170" fill="#eee" stroke="#333"/>
  <text x="230" y="154" font-family="monospace">discountCode == "FREEFRIDAY"</text>
  <text x="230" y="175" font-family="monospace">&amp;&amp;</text>
  <text x="230" y="196" font-family="monospace">day == "Friday"</text>
  <line x1="460" y1="170" x2="518" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="489" y="160" font-weight="bold">true</text>
  <rect x="520" y="145" width="200" height="50" rx="4" fill="#fff" stroke="#333"/>
  <text x="620" y="175" font-family="monospace">price = 0</text>
  <line x1="230" y1="245" x2="230" y2="303" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="280" font-weight="bold">false</text>

  <polygon points="230,305 460,380 230,455 0,380" fill="#eee" stroke="#333"/>
  <text x="230" y="364" font-family="monospace">day == "Saturday"</text>
  <text x="230" y="385" font-family="monospace">||</text>
  <text x="230" y="406" font-family="monospace">day == "Sunday"</text>
  <line x1="460" y1="380" x2="518" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="489" y="370" font-weight="bold">true</text>
  <rect x="520" y="355" width="200" height="50" rx="4" fill="#fff" stroke="#333"/>
  <text x="620" y="385" font-family="monospace">price = 10</text>
  <line x1="230" y1="455" x2="230" y2="513" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="490" font-weight="bold">false</text>

  <polygon points="230,515 460,590 230,665 0,590" fill="#eee" stroke="#333"/>
  <text x="230" y="596" font-family="monospace">age &lt;= 18</text>
  <line x1="460" y1="590" x2="518" y2="590" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="489" y="580" font-weight="bold">true</text>
  <rect x="520" y="565" width="200" height="50" rx="4" fill="#fff" stroke="#333"/>
  <text x="620" y="595" font-family="monospace">price = 5</text>
  <line x1="230" y1="665" x2="230" y2="723" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="700" font-weight="bold">false</text>
  <rect x="130" y="725" width="200" height="50" rx="4" fill="#fff" stroke="#333"/>
  <text x="230" y="755" font-family="monospace">price = 10</text>
</svg>
