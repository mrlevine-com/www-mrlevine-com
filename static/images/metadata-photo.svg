<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="sans-serif" font-size="16">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="240" height="180" rx="6" fill="#cfe8fc" stroke="#333"/>
  <circle cx="200" cy="65" r="22" fill="#d68a1c"/>
  <polygon points="20,200 100,90 170,200" fill="#5cb85c"/>
  <polygon points="120,200 190,120 260,200" fill="#449d44"/>
  <text x="140" y="230" text-anchor="middle" fill="#333" font-weight="bold">The data: a photo</text>
  <line x1="270" y1="110" x2="350" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360" y="20" width="260" height="180" rx="6" fill="#fff" stroke="#333"/>
  <g fill="#333">
    <text x="380" y="55">Camera: Fujifilm X-T2</text>
