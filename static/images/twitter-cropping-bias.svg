<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 170" font-family="sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <g fill="none" stroke-width="3">
    <rect x="10" y="20" width="180" height="130" rx="10" stroke="#d68a1c"/>
    <rect x="240" y="20" width="180" height="130" rx="10" stroke="#337ab7"/>
    <rect x="470" y="20" width="180" height="130" rx="10" stroke="#d9534f"/>
  </g>
  <g stroke="#555" stroke-width="3" marker-end="url(#arrow)">
    <line x1="195" y1="85" x2="230" y2="85"/>
    <line x1="425" y1="85" x2="460" y2="85"/>
  </g>
  <g text-anchor="middle" fill="#333">
    <text x="100" y="50" font-weight="bold">Training data</text>
    <text x="100" y="80">Where people's</text>
    <text x="100" y="100">eyes looked first</text>
    <text x="100" y="120">in photos</text>
    <text x="330" y="50" font-weight="bold">Algorithm</text>
    <text x="330" y="80">Crops each photo</text>
    <text x="330" y="100">around its "most</text>
    <text x="330" y="120">interesting" spot</text>
    <text x="560" y="50" font-weight="bold">Effect</text>
    <text x="560" y="80">Crops favored</text>
    <text x="560" y="100">white faces over</text>
    <text x="560" y="120">Black faces</text>
  </g>
</svg>
